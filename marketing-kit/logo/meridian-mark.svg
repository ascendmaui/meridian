<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img">
  <title>Meridian</title>
  <desc>Meridian globe mark. Deep sky blue sphere #00BFFF with a black meridian and equator.</desc>
  
  <g id="mark">
      <defs>
        <clipPath id="mark-clip"><circle cx="256" cy="256" r="196"/></clipPath>
      </defs>
      <circle cx="256" cy="256" r="196" fill="#00BFFF"/>
      <g clip-path="url(#mark-clip)">
        <circle cx="212.88" cy="310.88" r="180.32000000000002" fill="#404040" opacity="0.22"/>
        <ellipse cx="314.8" cy="185.44" rx="54.88" ry="27.44" fill="#FFFFFF" opacity="0.55"
          transform="rotate(-32 314.8 185.44)"/>
      </g>
      <g clip-path="url(#mark-clip)" fill="none" stroke="#404040" stroke-width="3.14" stroke-linecap="round">
        <ellipse cx="256" cy="256" rx="196" ry="64.68"/>
        <ellipse cx="256" cy="256" rx="90.16000000000001" ry="196"/>
        <ellipse cx="256" cy="165.83999999999997" rx="137.2" ry="25.48"/>
        <ellipse cx="256" cy="346.16" rx="137.2" ry="25.48"/>
      </g>
      <g clip-path="url(#mark-clip)" fill="none" stroke="#000000" stroke-width="5.10" stroke-linecap="round">
        <ellipse cx="256" cy="256" rx="31.36" ry="196"/>
        <line x1="60" y1="256" x2="452" y2="256"/>
      </g>
      <circle cx="256" cy="256" r="196" fill="none" stroke="#000000" stroke-width="8.82"/>
    </g>
</svg>
