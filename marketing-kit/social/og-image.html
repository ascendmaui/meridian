<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Meridian og-image</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: transparent;
    }
    svg {
      display: block;
      width: 1200px;
      height: 630px;
    }
  </style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img">
  <title>Meridian</title>
  <desc>Meridian social image. Deep sky blue globe on sky blue #87CEEB with the line Hosted interactive globe experience.</desc>
  <rect width="1200" height="630" fill="#87CEEB"/>
  <g id="og">
      <defs>
        <clipPath id="og-clip"><circle cx="330" cy="315" r="200"/></clipPath>
      </defs>
      <circle cx="330" cy="315" r="200" fill="#00BFFF"/>
      <g clip-path="url(#og-clip)">
        <circle cx="286.0" cy="371.0" r="184.0" fill="#404040" opacity="0.22"/>
        <ellipse cx="390.0" cy="243.0" rx="56.00000000000001" ry="28.000000000000004" fill="#FFFFFF" opacity="0.55"
          transform="rotate(-32 390.0 243.0)"/>
      </g>
      <g clip-path="url(#og-clip)" fill="none" stroke="#404040" stroke-width="3.20" stroke-linecap="round">
        <ellipse cx="330" cy="315" rx="200" ry="66.0"/>
        <ellipse cx="330" cy="315" rx="92.0" ry="200"/>
        <ellipse cx="330" cy="223.0" rx="140.0" ry="26.0"/>
        <ellipse cx="330" cy="407.0" rx="140.0" ry="26.0"/>
      </g>
      <g clip-path="url(#og-clip)" fill="none" stroke="#000000" stroke-width="5.20" stroke-linecap="round">
        <ellipse cx="330" cy="315" rx="32.0" ry="200"/>
        <line x1="130" y1="315" x2="530" y2="315"/>
      </g>
      <circle cx="330" cy="315" r="200" fill="none" stroke="#000000" stroke-width="9.00"/>
    </g>
<text x="590" y="300" fill="#000000" font-family="Arial, Liberation Sans, sans-serif" font-size="78" font-weight="700" text-anchor="start">Meridian</text>
<text x="590" y="362" fill="#404040" font-family="Arial, Liberation Sans, sans-serif" font-size="28" font-weight="400" text-anchor="start">Hosted interactive globe experience.</text>
</svg>

</body>
</html>
