<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Meridian Mac frame 2880x1800</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 2880px;
      height: 1800px;
      overflow: hidden;
      background: transparent;
    }
    svg {
      display: block;
      width: 2880px;
      height: 1800px;
    }
  </style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="2880" height="1800" viewBox="0 0 2880 1800" role="img">
  <title>Meridian Mac frame</title>
  <desc>Store template, 2880 by 1800. Browser window titled Meridian Globe showing sky #87CEEB and sphere #00BFFF. Drawn template, not a captured screenshot.</desc>
  <rect width="2880" height="1800" fill="#F0F0F0"/>

      <defs>
        <clipPath id="macmark-clip"><circle cx="250" cy="430" r="120"/></clipPath>
      </defs>
      <circle cx="250" cy="430" r="120" fill="#00BFFF"/>

        <circle cx="223.6" cy="463.6" r="110.4" fill="#404040" opacity="0.22"/>
        <ellipse cx="286.0" cy="386.8" rx="33.6" ry="16.8" fill="#FFFFFF" opacity="0.55"
          transform="rotate(-32 286.0 386.8)"/>
      </g>
      <g clip-path="url(#macmark-clip)" fill="none" stroke="#404040" stroke-width="1.92" stroke-linecap="round">
        <ellipse cx="250" cy="430" rx="120" ry="39.6"/>
        <ellipse cx="250" cy="430" rx="55.2" ry="120"/>

      <circle cx="250" cy="430" r="120" fill="none" stroke="#000000" stroke-width="5.40"/>
    </g>
<text x="140" y="680" fill="#000000" font-family="Arial, Liberation Sans, sans-serif" font-size="92" font-weight="700" text-anchor="start">Meridian</text>
<text x="140" y="760" fill="#404040" font-family="Arial, Liberation Sans, sans-serif" font-size="36" font-weight="400" text-anchor="start">Hosted interactive globe experience.</text>
<text x="140" y="880" fill="#000000" font-family="Arial, Liberation Sans, sans-serif" font-size="30" font-weight="400" text-anchor="start">Interactive 3D visualization</text>
<text x="140" y="936" fill="#000000" font-family="Arial, Liberation Sans, sans-serif" font-size="30" font-weight="400" text-anchor="start">Opens in the browser</text>
<text x="140" y="992" fill="#666666" font-family="Arial, Liberation Sans, sans-serif" font-size="30" font-weight="400" text-anchor="start">Ascend Maui</text>
<clipPath id="macwin"><rect x="1040" y="150" width="1680" height="1500" rx="18"/></clipPath>
<g clip-path="url(#macwin)">
<rect x="1040" y="150" width="1680" height="1500" fill="#87CEEB"/>
<rect x="1040" y="150" width="1680" height="72" fill="#000000"/>
<text x="1076" y="196" fill="#FFFFFF" font-family="Arial, Liberation Sans, sans-serif" font-size="28" font-weight="400" text-anchor="start">Meridian Globe</text>
<g id="macglobe">
      <defs>
        <clipPath id="macglobe-clip"><circle cx="1880.0" cy="936.0" r="390"/></clipPath>
      </defs>
      <circle cx="1880.0" cy="936.0" r="390" fill="#00BFFF"/>

        <line x1="1490.0" y1="936.0" x2="2270.0" y2="936.0"/>

      <circle cx="1880.0" cy="936.0" r="390" fill="none" stroke="#000000" stroke-width="17.55"/>

</g>
<rect x="1040" y="150" width="1680" height="1500" rx="18" fill="none" stroke="#000000" stroke-width="4"/>
</svg>

</html>
