<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Meridian Globe Experience - Interactive 3D visualization">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌍</text></svg>" type="image/svg+xml">


    <title>Meridian Globe</title>
    <style>
      .skip-link {
        position: absolute;
        top: -40px;
        left: 0;
        background: #000;
        color: white;
        padding: 8px;
        z-index: 100;
      }
      .skip-link:focus {
        top: 0;
      }
      #globe-container {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f0f0f0;
        overflow: hidden;
      }
      #globe-container canvas {
        display: block;
      }
      #globe-placeholder {
        font-family: Arial, sans-serif;
        font-size: 1.2rem;
        color: #666;
        text-align: center;
      }
    </style>
</head>
<body>
    <a href="#globe-container" class="skip-link">Skip to globe visualization</a>
    <main>
        <div id="globe-container" role="img" aria-label="3D globe visualization">
          <div id="globe-placeholder">Loading globe visualization...</div>
        </div>
    </main>
    <!-- Three.js via CDN -->
    <script defer src="https://cdn.jsdelivr.net/npm/three/build/three.min.js"></script>
    <script type="module" src="/src/index.js"></script>
</body>
</html>
