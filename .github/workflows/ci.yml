name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install dependencies
      run: npm ci

    - name: Start server
      run: |
        nohup node server.js > server.log 2>&1 &
        echo $! > server.pid
        sleep 10

    - name: Wait for server
      run: |
        for i in {1..30}; do
          if curl -s http://localhost:8080 > /dev/null; then
            echo "Server is ready"
            break
          fi
          echo "Waiting for server..."
          sleep 2
        done

    - name: Run tests
      run: npm test

    - name: Run performance audit
      run: ./run-audit-performance.sh

    - name: Run accessibility audit
      run: ./run-audit-accessibility.sh

    - name: Run agentic browsing audit
      run: ./run-audit-agentic.sh

    - name: Run security audit
      run: npm audit

    - name: Content audit (manual)
      run: echo "Content audit manual step - please review content for accuracy and tone"

    - name: Compatibility audit (manual)
      run: echo "Compatibility audit manual step - please test on target browsers and devices"

    - name: Stop server
      if: always()
      run: |
        if [ -f server.pid ]; then
          kill $(cat server.pid) || true
          rm server.pid
        fi
